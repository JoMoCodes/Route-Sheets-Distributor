name: Build Windows app

# Every push builds and tests the app and uploads the .exe files as a workflow artifact.
# Pushing a version tag (e.g. v1.0.1) also publishes a GitHub Release, which installed
# copies of the app pick up automatically as an update.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version $pkg. Bump the version before tagging."
            exit 1
          fi

      - name: Build installer and portable .exe
        run: npx electron-builder --win nsis portable --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Route-Sheet-Distributor-Windows
          path: |
            dist/*.exe
          if-no-files-found: error
